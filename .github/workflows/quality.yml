name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks and browser API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  api:
    name: Laravel tests and formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - uses: actions/cache@v6
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/pint --test

  api-postgres:
    name: Laravel PostgreSQL migration and test compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edtechlive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edtechlive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: edtechlive_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_pgsql, session, tokenizer, xml
          coverage: none
      - uses: actions/cache@v6
        with:
          path: apps/api/vendor
          key: composer-pgsql-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-pgsql-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan migrate:fresh --force
      - run: vendor/bin/phpunit

  api-container:
    name: Laravel production container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag edtechlive-api:ci ./apps/api
      - name: Start image and check liveness endpoint
        shell: bash
        run: |
          docker run --detach --name edtechlive-api-ci \
            --publish 127.0.0.1:10000:10000 \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            edtechlive-api:ci
          trap 'docker rm --force edtechlive-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/api/v1/health >/dev/null; then
              echo "Container liveness check passed."
              exit 0
            fi
            sleep 2
          done
          docker logs edtechlive-api-ci
          exit 1

  mobile:
    name: Expo mobile typecheck and Android bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform android --no-bytecode --no-minify --output-dir .expo-build
